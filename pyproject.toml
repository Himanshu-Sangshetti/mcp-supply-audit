[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-supply-audit"
version = "0.2.0"
description = "Read-only supply-chain auditor for MCP servers: transitive dependency tree, registry provenance, SDK currency, capability surface."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Himanshu Sangshetti", email = "himanshu.sangshetti@mem0.ai" }]
keywords = ["mcp", "model-context-protocol", "supply-chain", "security", "audit", "owasp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6", "pytest-cov>=5"]

[project.scripts]
mcp-supply-audit = "mcp_supply_audit.cli:main"

[project.urls]
Homepage = "https://github.com/Himanshu-Sangshetti/mcp-supply-audit"
Repository = "https://github.com/Himanshu-Sangshetti/mcp-supply-audit"
Issues = "https://github.com/Himanshu-Sangshetti/mcp-supply-audit/issues"
Changelog = "https://github.com/Himanshu-Sangshetti/mcp-supply-audit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Himanshu-Sangshetti/mcp-supply-audit/blob/main/docs/METHODOLOGY.md"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_supply_audit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/corpus",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/action.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["mcp_supply_audit"]
branch = true

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover"]

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
