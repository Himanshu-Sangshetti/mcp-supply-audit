name: mcp-supply-audit
description: Audit an MCP server's supply chain (package tree, registry provenance, SDK currency) before you trust it.
author: Himanshu Sangshetti
branding:
  icon: shield
  color: red
inputs:
  package:
    description: npm package name of the MCP server to audit (e.g. @modelcontextprotocol/server-filesystem)
    required: true
  fail-under:
    description: Fail the workflow if the overall score is below this number (0-100)
    required: false
    default: "0"
  sarif:
    description: Also write results to mcp-supply-audit.sarif for code-scanning upload
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    # Install *this* checkout — do not pull PyPI. The action is usable before publish.
    - name: Install mcp-supply-audit from the action
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Audit MCP server supply chain
      shell: bash
      run: |
        mcp-supply-audit "${{ inputs.package }}" --fail-under "${{ inputs.fail-under }}"
    - name: Emit SARIF (optional)
      if: inputs.sarif == 'true'
      shell: bash
      run: |
        mcp-supply-audit "${{ inputs.package }}" --sarif > mcp-supply-audit.sarif
